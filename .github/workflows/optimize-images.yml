name: Optimizar imágenes

on:
  push:
    # Las ramas cms/** son las que crea el CMS al preparar una entrada:
    # ahí el bot sí puede escribir, así que la imagen llega ya optimizada
    # al merge. gh-pages se mantiene para las subidas hechas a mano.
    branches:
      - gh-pages
      - 'cms/**'
    paths:
      - 'images/**'

permissions:
  contents: write

jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar ImageMagick
        run: |
          sudo rm -rf /var/lib/apt/lists/*
          sudo apt-get clean
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends imagemagick

      - name: Detectar imágenes nuevas del push
        id: changed
        run: |
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"
          # Si BEFORE es 0000... (primer push de la rama) usar HEAD solo
          if [[ "$BEFORE" == "0000000000000000000000000000000000000000" ]]; then
            RANGE="$AFTER"
            git show --name-only --diff-filter=AM --pretty=format: "$AFTER" -- 'images/**' | \
              grep -iE '\.(jpg|jpeg|png|webp)$' > /tmp/changed_images.txt || true
          else
            git diff --name-only --diff-filter=AM "$BEFORE" "$AFTER" -- 'images/**' | \
              grep -iE '\.(jpg|jpeg|png|webp)$' > /tmp/changed_images.txt || true
          fi
          echo "Imágenes a optimizar:"
          cat /tmp/changed_images.txt || true

      - name: Optimizar JPG/JPEG
        run: |
          grep -iE '\.(jpg|jpeg)$' /tmp/changed_images.txt | \
            xargs -r -d '\n' -P 4 -I {} mogrify -strip -quality 85 -interlace Plane -resize '1400x>' "{}" || true

      - name: Optimizar PNG
        run: |
          grep -iE '\.png$' /tmp/changed_images.txt | \
            xargs -r -d '\n' -P 4 -I {} mogrify -strip -resize '1400x>' -define png:compression-level=9 "{}" || true

      - name: Optimizar WebP
        run: |
          grep -iE '\.webp$' /tmp/changed_images.txt | \
            xargs -r -d '\n' -P 4 -I {} mogrify -strip -quality 85 -resize '1400x>' "{}" || true

      - name: Avisar de imágenes que siguen pesando más de 1 MB
        run: |
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            size=$(stat -c%s "$f")
            if [ "$size" -gt 1048576 ]; then
              echo "::warning file=$f::Sigue pesando $((size/1024)) KB tras optimizar. Un PNG fotográfico conviene convertirlo a JPG a mano (y actualizar la referencia en el post)."
            fi
          done < /tmp/changed_images.txt

      - name: Commit si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add images/
          if git diff --staged --quiet; then
            echo "No hay imágenes que optimizar."
            exit 0
          fi
          git commit -m "Optimizar imágenes subidas"
          # Sin '|| true': si el push falla, el workflow se pone en rojo en
          # vez de perder la optimización en silencio.
          if ! git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"; then
            if [ "${GITHUB_REF_NAME}" = "gh-pages" ]; then
              echo "::error::gh-pages está protegida y el bot no puede escribir en ella. Las imágenes subidas por el CMS se optimizan solas en su rama cms/**; para una subida directa a gh-pages, optimiza en local u otorga bypass a github-actions[bot]."
            fi
            exit 1
          fi
