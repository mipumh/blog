name: Optimizar imágenes

on:
  push:
    branches: [gh-pages]
    paths:
      - 'images/**'

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar ImageMagick
        run: sudo apt-get install -y imagemagick

      - name: Optimizar JPG/JPEG
        run: |
          find images/ -type f \( -iname '*.jpg' -o -iname '*.jpeg' \) -print0 | \
            xargs -0 -P 4 -I {} mogrify -strip -quality 85 -interlace Plane -resize '1400x>' "{}" || true

      - name: Optimizar PNG
        run: |
          find images/ -type f -iname '*.png' -print0 | \
            xargs -0 -P 4 -I {} mogrify -strip "{}" || true

      - name: Commit si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add images/
          git diff --staged --quiet || git commit -m "Optimizar imágenes subidas"
          git push || true
