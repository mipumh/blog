name: Optimizar imágenes

on:
  push:
    branches: [gh-pages]
    paths:
      - 'images/**'

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar ImageMagick
        run: sudo apt-get install -y imagemagick

      - name: Detectar imágenes nuevas del commit
        id: changed
        run: |
          git diff --name-only HEAD~1 HEAD -- 'images/**' | \
            grep -iE '\.(jpg|jpeg|png|webp)$' > /tmp/changed_images.txt || true
          echo "Imágenes a optimizar:"
          cat /tmp/changed_images.txt

      - name: Optimizar JPG/JPEG
        run: |
          grep -iE '\.(jpg|jpeg)$' /tmp/changed_images.txt | \
            xargs -d '\n' -P 4 -I {} mogrify -strip -quality 85 -interlace Plane -resize '1400x>' "{}" || true

      - name: Optimizar PNG
        run: |
          grep -iE '\.png$' /tmp/changed_images.txt | \
            xargs -d '\n' -P 4 -I {} mogrify -strip "{}" || true

      - name: Optimizar WebP
        run: |
          grep -iE '\.webp$' /tmp/changed_images.txt | \
            xargs -d '\n' -P 4 -I {} mogrify -strip -quality 85 -resize '1400x>' "{}" || true

      - name: Commit si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add images/
          git diff --staged --quiet || git commit -m "Optimizar imágenes subidas"
          git push || true
