name: Optimizar imágenes

on:
  push:
    # Las ramas cms/** son las que crea el CMS al preparar una entrada:
    # ahí el bot sí puede escribir, así que la imagen llega ya optimizada
    # al merge. gh-pages se mantiene para las subidas hechas a mano.
    branches:
      - gh-pages
      - 'cms/**'
    paths:
      - 'images/**'

permissions:
  contents: write

concurrency:
  # El CMS hace varios push seguidos mientras se edita la entrada; basta con
  # que se optimice el último estado de la rama.
  group: optimizar-imagenes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar ImageMagick
        run: |
          sudo rm -rf /var/lib/apt/lists/*
          sudo apt-get clean
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends imagemagick

      - name: Detectar imágenes nuevas del push
        id: changed
        run: |
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"
          # Si BEFORE es 0000... (primer push de la rama) usar HEAD solo
          if [[ "$BEFORE" == "0000000000000000000000000000000000000000" ]]; then
            RANGE="$AFTER"
            git show --name-only --diff-filter=AM --pretty=format: "$AFTER" -- 'images/**' | \
              grep -iE '\.(jpg|jpeg|png|webp)$' > /tmp/changed_images.txt || true
          else
            git diff --name-only --diff-filter=AM "$BEFORE" "$AFTER" -- 'images/**' | \
              grep -iE '\.(jpg|jpeg|png|webp)$' > /tmp/changed_images.txt || true
          fi
          echo "Imágenes a optimizar:"
          cat /tmp/changed_images.txt || true

      - name: Optimizar JPG/JPEG
        run: |
          grep -iE '\.(jpg|jpeg)$' /tmp/changed_images.txt | \
            xargs -r -d '\n' -P 4 -I {} mogrify -strip -quality 85 -interlace Plane -resize '1400x>' "{}" || true

      - name: Optimizar PNG
        run: |
          grep -iE '\.png$' /tmp/changed_images.txt | \
            xargs -r -d '\n' -P 4 -I {} mogrify -strip -resize '1400x>' -define png:compression-level=9 "{}" || true

      - name: Convertir a JPG los PNG que siguen pesando
        run: |
          # Un PNG fotográfico (los que genera el CMS, o los de IA) no adelgaza
          # con -strip: hay que cambiar de formato. Se convierte solo si pesa
          # más de 400 KB y no tiene transparencia, y se actualiza la
          # referencia en los posts para no dejar la imagen rota.
          while IFS= read -r f; do
            case "$f" in *.png|*.PNG) ;; *) continue ;; esac
            [ -f "$f" ] || continue
            size=$(stat -c%s "$f")
            [ "$size" -le 409600 ] && continue
            # ImageMagick 6 (el del runner) responde en minúsculas y el 7 en
            # mayúsculas, así que se normaliza; si la respuesta no es clara se
            # mira el canal alfa antes de descartar la conversión.
            opaque=$(identify -format '%[opaque]' "$f" 2>/dev/null | tr '[:upper:]' '[:lower:]')
            if [ "$opaque" != "true" ]; then
              channels=$(identify -format '%[channels]' "$f" 2>/dev/null | tr '[:upper:]' '[:lower:]')
              case "$channels" in
                *a)
                  echo "::warning file=$f::Tiene transparencia: se deja en PNG."
                  continue
                  ;;
              esac
            fi
            dst="${f%.*}.jpg"
            if [ -e "$dst" ]; then
              echo "::warning file=$f::Ya existe $dst, no se convierte."
              continue
            fi
            convert "$f" -background white -alpha remove -alpha off -strip -resize '1400x>' -quality 85 -interlace Plane "$dst"
            base_png=$(basename "$f"); base_jpg=$(basename "$dst")
            # Sustituye el nombre del fichero en los posts que lo referencian
            grep -rl --include='*.md' "$base_png" _posts 2>/dev/null | while IFS= read -r post; do
              sed -i "s|${base_png}|${base_jpg}|g" "$post"
              echo "Referencia actualizada en $post"
            done
            git rm -q --cached "$f" >/dev/null 2>&1 || true
            rm -f "$f"
            echo "$f ($((size/1024)) KB) -> $dst ($(( $(stat -c%s "$dst") /1024)) KB)"
          done < /tmp/changed_images.txt

      - name: Optimizar WebP
        run: |
          grep -iE '\.webp$' /tmp/changed_images.txt | \
            xargs -r -d '\n' -P 4 -I {} mogrify -strip -quality 85 -resize '1400x>' "{}" || true

      - name: Descartar reoptimizaciones que no ahorran nada
        run: |
          # mogrify reescribe el fichero aunque no haya nada que ganar, así que
          # una imagen ya optimizada volvería a recomprimirse en cada pasada
          # (pérdida generacional) y generaría commits vacíos. Si el ahorro no
          # llega al 5%, se recupera la versión original.
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            git diff --quiet -- "$f" && continue
            new_size=$(stat -c%s "$f")
            old_size=$(git cat-file -s "$(git rev-parse HEAD:"$f")" 2>/dev/null || echo 0)
            [ "$old_size" -eq 0 ] && continue
            if [ "$new_size" -gt $((old_size * 95 / 100)) ]; then
              echo "Sin ahorro apreciable en $f ($((old_size/1024)) KB -> $((new_size/1024)) KB): se deja como estaba."
              git checkout -- "$f"
            fi
          done < /tmp/changed_images.txt

      - name: Avisar de imágenes que siguen pesando más de 1 MB
        run: |
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            size=$(stat -c%s "$f")
            if [ "$size" -gt 1048576 ]; then
              echo "::warning file=$f::Sigue pesando $((size/1024)) KB tras optimizar. Un PNG fotográfico conviene convertirlo a JPG a mano (y actualizar la referencia en el post)."
            fi
          done < /tmp/changed_images.txt

      - name: En gh-pages solo avisar, no escribir
        if: github.ref_name == 'gh-pages'
        run: |
          # El bot no puede escribir en gh-pages (rama protegida) y el CMS ya
          # trae sus imágenes optimizadas desde la rama cms/**. Intentar el
          # push aquí solo producía un fallo en rojo en cada merge, así que
          # este paso informa de lo que quedaría por hacer y termina en verde.
          if git diff --quiet; then
            echo "Nada que optimizar: las imágenes llegaron ya ligeras."
          else
            echo "::notice::Estas imágenes admitirían algo más de optimización, pero llegaron por un push directo a gh-pages. Si quieres apurarlas, hazlo en local:"
            git diff --name-only | sed 's/^/  /'
          fi
          git checkout -- . 2>/dev/null || true

      - name: Commit si hay cambios
        if: github.ref_name != 'gh-pages'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add images/ _posts/
          if git diff --staged --quiet; then
            echo "No hay imágenes que optimizar."
            exit 0
          fi
          git commit -m "Optimizar imágenes subidas"
          # Sin '|| true': si el push falla, el workflow se pone en rojo en
          # vez de perder la optimización en silencio.
          # Si el CMS ha vuelto a escribir en la rama mientras optimizábamos,
          # el push se rechaza: hay que reincorporar su trabajo y reintentar.
          pushed=0
          for intento in 1 2 3; do
            if git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"; then
              pushed=1
              break
            fi
            echo "Push rechazado (intento $intento). Reincorporando los cambios de la rama..."
            if ! git pull --rebase origin "${GITHUB_REF_NAME}"; then
              git rebase --abort 2>/dev/null || true
              echo "::error::No se pudo reincorporar el trabajo de la rama; la optimización se reintentará en el siguiente push."
              break
            fi
          done
          if [ "$pushed" -ne 1 ]; then
            if [ "${GITHUB_REF_NAME}" = "gh-pages" ]; then
              echo "::error::gh-pages está protegida y el bot no puede escribir en ella. Las imágenes del CMS se optimizan en su rama cms/**; para una subida directa a gh-pages, optimiza en local u otorga bypass a github-actions[bot]."
            fi
            exit 1
          fi
