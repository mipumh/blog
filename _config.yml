# Site
title: "Revista de Innovación en Periodismo"
description: "Análisis, casos y entrevistas sobre innovación en periodismo"
url: "https://mip.umh.es"
baseurl: "/blog"
lang: "es"

# Legacy branding (kept for backward compat with old includes)
inc:
  title: "Revista de Innovación en Periodismo"
  subtitle: "Amplía tu conocimiento sobre innovación en periodismo con análisis, casos y entrevistas a profesionales."
  cover_image: portada21.webp
  logo: logo.webp
  company: Máster en Innovación en Periodismo
  url: https://mip.umh.es
  facebook: mipumh
  twitter: mipumh
  product_link: https://mip.umh.es/?utm_source=blog&utm_campaign=blog
  tagline: "Idea, diseña, emprende"
  analytics:
    google: true

# Build
markdown: kramdown
highlighter: rouge
permalink: /:year/:month/:day/:title/

sass:
  load_paths:
    - _sass
    - node_modules

# Collections
collections:
  authors:
    output: true
    permalink: /authors/:name/

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "article"
      featured: false
      popular: 0
  - scope:
      path: ""
      type: "authors"
    values:
      layout: "author"

# Pagination (jekyll-paginate-v2)
pagination:
  enabled: true
  per_page: 24
  permalink: "/page/:num/"
  sort_field: "date"
  sort_reverse: true

autopages:
  enabled: true
  categories:
    enabled: true
    layouts: ["section.html"]
    permalink: "/:cat/"
  tags:
    enabled: true
    layouts: ["tag.html"]
    permalink: "/tags/:tag/"
  collections:
    enabled: false

# Plugins
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-paginate-v2
  - jekyll-include-cache

# Feed
feed:
  categories:
    - narrativas
    - industria
    - tecnologia
    - redaccion
    - audiencias

# SEO
twitter:
  username: mipumh
  card: summary_large_image

# Exclude
exclude:
  - node_modules
  - Gemfile
  - Gemfile.lock
  - package.json
  - package-lock.json
  - purgecss.config.js
  - netlify.toml
  - vendor
  - renove
  - scripts
  - _newsletters
