inc:
  # Blog Information
  title:        "Revista de Innovación en Periodismo"
  subtitle:     "Amplía tu conocimiento sobre innovación en periodismo con análisis, casos y entrevistas a profesionales."
  cover_image:  portada21.webp
  logo:         logo.webp

  # Company information
  company:      Máster en Innovación en Periodismo
  url:          https://mip.umh.es
  facebook:     mipumh
  twitter:      mipumh

  # Product Information
  product_link: https://mip.umh.es/?utm_source=blog&utm_campaign=blog
  tagline:      "Idea, diseña, emprende"

# Analytics     
  analytics:
    ga4: "G-BEL40TFYNP"   # Flujo «MIP - GA4» (5619000511). Vacío = sin analítica
 
baseurl: "/blog" # the subpath of your site, e.g. /blog/
url: https://mip.umh.es/blog

collections:
  conferencias:
    output: true
    permalink: /:collection/:title

# Build settings
markdown: kramdown

plugins: [jekyll-paginate]
permalink:     pretty
paginate_path: 'page:num'
paginate: 10

exclude:
  - admin
  - netlify.toml
  - node_modules
