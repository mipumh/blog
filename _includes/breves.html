<div class="sidebar-block breves">
  <h3 class="sidebar-label">Breves</h3>
  <ul class="breves-list" role="list">
    {% for item in site.data.breves limit:6 %}
    <li class="breves-item{% if item.highlight %} breves-item--hl{% endif %}">
      <a href="{% if item.external %}{{ item.url }}{% else %}{{ site.baseurl }}{{ item.url }}{% endif %}"
         {% if item.external %}target="_blank" rel="noopener"{% endif %}>
        {{ item.title }}
        {% if item.external %}<span class="ext-icon" aria-label="(enlace externo)">&nearr;</span>{% endif %}
      </a>
      <time datetime="{{ item.date | date_to_xmlschema }}">{{ item.date | date: "%d %b" }}</time>
    </li>
    {% endfor %}
  </ul>
</div>
