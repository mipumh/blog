<section class="newsletter-banner hp-block" aria-label="Newsletter">
  <h2 class="newsletter-banner__title">{{ site.data.newsletter.title }}</h2>
  <p class="newsletter-banner__desc">{{ site.data.newsletter.description }}</p>
  <form class="newsletter-banner__form" action="{{ site.data.newsletter.action_url }}" method="post"
        aria-label="Suscripcion al newsletter">
    <label for="nl-banner-email" class="visually-hidden">Correo electronico</label>
    <input type="email" id="nl-banner-email" name="email" required
           placeholder="tu@email.com"
           class="newsletter-input"
           autocomplete="email">
    <input type="text" name="website" class="visually-hidden" tabindex="-1" autocomplete="off" aria-hidden="true">
    <button type="submit" class="btn-newsletter">Suscribirse</button>
  </form>
</section>
