<section class="newsletter-big hp-block" aria-label="Newsletter">
  <div class="newsletter-big__inner">
    <div class="newsletter-big__content">
      <h2 class="newsletter-big__title">Innovación en periodismo en tu inbox</h2>
      <p class="newsletter-big__desc">
        Análisis, casos y entrevistas sobre innovación en periodismo. Cada semana en tu correo.
      </p>
      <form class="newsletter-big__form" action="{{ site.data.newsletter.action_url }}" method="post"
            aria-label="Suscripcion al newsletter">
        <label for="nl-big-email" class="visually-hidden">Correo electronico</label>
        <input type="email" id="nl-big-email" name="email" required placeholder="Email"
               class="newsletter-big__input" autocomplete="email">
        <input type="text" name="website" class="visually-hidden" tabindex="-1" autocomplete="off" aria-hidden="true">
        <button type="submit" class="newsletter-big__btn">Suscribirse</button>
      </form>
    </div>
  </div>
</section>
