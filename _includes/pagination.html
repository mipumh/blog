{% if paginator.total_pages > 1 %}
<nav class="pagination-wrapper" aria-label="Paginacion">
  <ul class="pagination">
    {% if paginator.previous_page %}
    <li class="page-item">
      <a href="{{ site.baseurl }}{{ paginator.previous_page_path }}" class="page-link" aria-label="Pagina anterior">
        &larr; Anterior
      </a>
    </li>
    {% endif %}

    <li class="page-item disabled">
      <span class="page-link">{{ paginator.page }} / {{ paginator.total_pages }}</span>
    </li>

    {% if paginator.next_page %}
    <li class="page-item">
      <a href="{{ site.baseurl }}{{ paginator.next_page_path }}" class="page-link" aria-label="Pagina siguiente">
        Siguiente &rarr;
      </a>
    </li>
    {% endif %}
  </ul>
</nav>
{% endif %}
