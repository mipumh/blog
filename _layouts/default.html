<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>

  <!-- Dark mode detection: runs before CSS to prevent flash -->
  <script>
  (function() {
    var theme = localStorage.getItem('theme');
    if (!theme) {
      theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', theme);
  })();
  </script>

  <!-- Preload critical fonts (only the two most used) -->
  <link rel="preload" href="{{ site.baseurl }}/assets/fonts/JetBrainsMono-Regular.woff2"
        as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{ site.baseurl }}/assets/fonts/PTSerif-Regular.woff2"
        as="font" type="font/woff2" crossorigin>

  <!-- Preload main stylesheet for faster FCP -->
  <link rel="preload" href="{{ site.baseurl }}/assets/css/main.css" as="style">

  <!-- Favicon -->
  <link rel="icon" href="{{ site.baseurl }}/favicon.ico" sizes="any">
  <link rel="icon" href="{{ site.baseurl }}/images/logo.webp" type="image/webp">
  <link rel="apple-touch-icon" href="{{ site.baseurl }}/images/logo.webp">

  {% seo %}

  <!-- Main stylesheet -->
  <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/main.css">

  <!-- RSS -->
  {% feed_meta %}
</head>
<body>
  <a href="#main-content" class="skip-link visually-hidden-focusable">Saltar al contenido</a>

  {% include header.html %}

  <main id="main-content">
    {{ content }}
  </main>

  {% include footer.html %}

  <!-- Search overlay -->
  <div id="search-overlay" class="search-overlay" hidden data-baseurl="{{ site.baseurl }}">
    <div class="search-overlay__inner">
      <button class="search-overlay__close" aria-label="Cerrar búsqueda">&times;</button>
      <input type="search" id="search-input" class="search-input"
             placeholder="Buscar artículos..." autocomplete="off">
      <div id="search-results" class="search-results" role="listbox"></div>
    </div>
  </div>

  <!-- Deferred scripts -->
  <script defer src="{{ site.baseurl }}/assets/js/header-scroll.js"></script>
  <script defer src="{{ site.baseurl }}/assets/js/newsletter-inject.js"></script>
  <script defer src="{{ site.baseurl }}/assets/js/newsletter-submit.js"></script>
  <script defer src="{{ site.baseurl }}/assets/js/search.js"></script>
  <script defer src="{{ site.baseurl }}/assets/js/carousel.js"></script>
  <script defer>
    // Share buttons toggle
    document.addEventListener('click', function(e) {
      var toggle = e.target.closest('[data-share-toggle]');
      if (toggle) {
        e.preventDefault();
        var dropdown = toggle.nextElementSibling;
        if (dropdown) dropdown.hidden = !dropdown.hidden;
        return;
      }
      var copyBtn = e.target.closest('[data-copy-url]');
      if (copyBtn) {
        e.preventDefault();
        var url = copyBtn.getAttribute('data-copy-url');
        navigator.clipboard.writeText(url).then(function() {
          var span = copyBtn.querySelector('span');
          var orig = span.textContent;
          span.textContent = '¡Copiado!';
          setTimeout(function() { span.textContent = orig; }, 1500);
        });
        return;
      }
      // Close dropdowns when clicking outside
      var dropdowns = document.querySelectorAll('.share-dropdown');
      for (var i = 0; i < dropdowns.length; i++) {
        if (!dropdowns[i].contains(e.target)) dropdowns[i].hidden = true;
      }
    });

    // Dark mode toggle (both header and mega-menu buttons)
    function toggleTheme() {
      var current = document.documentElement.getAttribute('data-theme');
      var next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
    }
    ['theme-toggle', 'theme-toggle-mega'].forEach(function(id) {
      var btn = document.getElementById(id);
      if (btn) btn.addEventListener('click', toggleTheme);
    });

    // Mega menu toggle (hamburger)
    var menuBtn = document.getElementById('menu-toggle');
    var megaMenu = document.getElementById('mega-menu');
    function closeMenu() {
      menuBtn.setAttribute('aria-expanded', 'false');
      megaMenu.classList.remove('is-open');
      document.body.classList.remove('menu-open');
    }
    if (menuBtn && megaMenu) {
      menuBtn.addEventListener('click', function() {
        var expanded = menuBtn.getAttribute('aria-expanded') === 'true';
        if (expanded) { closeMenu(); } else {
          menuBtn.setAttribute('aria-expanded', 'true');
          megaMenu.classList.add('is-open');
          document.body.classList.add('menu-open');
        }
      });
      // Close mega menu on Escape
      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && megaMenu.classList.contains('is-open')) closeMenu();
      });
      // Close mega menu when clicking a link inside it
      megaMenu.addEventListener('click', function(e) {
        if (e.target.tagName === 'A') closeMenu();
      });
    }

    // Floating sidebar: settle to top after scrolling
    var floatSidebar = document.querySelector('.article-float-sidebar');
    if (floatSidebar) {
      var settled = false;
      window.addEventListener('scroll', function() {
        if (!settled && window.scrollY > window.innerHeight * 0.4) {
          floatSidebar.classList.add('is-settled');
          settled = true;
        }
      }, { passive: true });
    }
  </script>
</body>
</html>
